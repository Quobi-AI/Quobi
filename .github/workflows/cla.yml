name: "CLA Assistant"

# Checks every pull request: if the author has not signed the CLA (CLA.md),
# the bot posts a comment with a link to sign and blocks the merge until they
# do. Signing is a one-time comment on the PR; the bot remembers signers in
# signatures/version1/cla.json in this repo. No extra secret is needed because
# signatures are stored in this same repo (GITHUB_TOKEN is provided automatically).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write        # commit the signatures file (signatures/version1/cla.json)
  pull-requests: write   # comment on the PR
  statuses: write        # set the CLA check status
  # 'actions: write' is intentionally omitted (least privilege). If a future
  # version of the action needs it, add it back here.

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to a commit SHA (not a movable tag) so an upstream tag change
        # cannot silently alter what runs. Dependabot keeps it current.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Quobi-AI/Quobi/blob/main/CLA.md"
          branch: "main"
          # The phrase a contributor comments on their PR to sign.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          # People who never need to sign. Add yourself and any maintainers here,
          # comma separated, so you do not have to sign your own PRs. Bots are
          # already excluded.
          allowlist: "*[bot]"
